<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042721" />
      <stop offset="50%" stop-color="#093f36" />
      <stop offset="100%" stop-color="#042721" />
    </linearGradient>

    <!-- Gold Foil Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="30%" stop-color="#E2B755" />
      <stop offset="70%" stop-color="#C6922C" />
      <stop offset="100%" stop-color="#9A6B15" />
    </linearGradient>

    <!-- Inner Emerald Gradient -->
    <linearGradient id="innerEmerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e564b" />
      <stop offset="100%" stop-color="#06322b" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#E2B755" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="105" fill="url(#bgGrad)" />

  <!-- Subtle Islamic Pattern Overlay Circle -->
  <circle cx="256" cy="220" r="175" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="6 6" />

  <!-- Center Emblem Group -->
  <g filter="url(#glow)" transform="translate(0, -10)">
    <!-- Outer Dome Arch -->
    <path
      d="M 256 95
         C 285 130 330 165 330 220
         C 330 270 310 285 295 285
         L 217 285
         C 202 285 182 270 182 220
         C 182 165 227 130 256 95 Z"
      fill="url(#innerEmerald)"
      stroke="url(#goldGrad)"
      stroke-width="7"
      stroke-linejoin="round"
    />

    <!-- Inner Dome Arch Accent -->
    <path
      d="M 256 128
         C 278 155 308 182 308 225
         C 308 260 292 270 282 270
         L 230 270
         C 220 270 204 260 204 225
         C 204 182 234 155 256 128 Z"
      fill="none"
      stroke="url(#goldGrad)"
      stroke-width="3"
      stroke-opacity="0.8"
    />

    <!-- Open Holy Quran Motif -->
    <!-- Left Page -->
    <path
      d="M 256 265
         C 220 245 180 250 160 260
         C 160 295 195 305 256 312 Z"
      fill="url(#goldGrad)"
    />
    <!-- Right Page -->
    <path
      d="M 256 265
         C 292 245 332 250 352 260
         C 352 295 317 305 256 312 Z"
      fill="url(#goldGrad)"
    />

    <!-- Quran Stand / Rehal -->
    <path
      d="M 210 305 L 185 335 L 215 335 L 245 310 Z"
      fill="url(#goldGrad)"
      opacity="0.85"
    />
    <path
      d="M 302 305 L 327 335 L 297 335 L 267 310 Z"
      fill="url(#goldGrad)"
      opacity="0.85"
    />

    <!-- Small Star & Crescent or Light on top -->
    <circle cx="256" cy="165" r="4.5" fill="url(#goldGrad)" />
  </g>

  <!-- Brand Typography: RajinQU -->
  <text
    x="256"
    y="415"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Outfit', 'Inter', sans-serif"
    font-size="44"
    font-weight="900"
    letter-spacing="2.5"
    fill="url(#goldGrad)"
  >
    RajinQU
  </text>

  <!-- Subtitle: PPTQ AL-USYMUNI -->
  <text
    x="256"
    y="448"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Outfit', 'Inter', sans-serif"
    font-size="12"
    font-weight="700"
    letter-spacing="4"
    fill="#9EC8C0"
    opacity="0.9"
  >
    PPTQ AL-USYMUNI
  </text>
</svg>
